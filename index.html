<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KORVEX CONNECT — Interactive Prototype</title><style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#20252a;background:#f4f5f6}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}.shell{max-width:1200px;margin:auto;min-height:100vh;display:grid;grid-template-columns:235px 1fr}.side{background:#20252a;color:white;padding:26px 17px}.brand{font-weight:900;letter-spacing:1.2px;font-size:21px}.brand b{color:#f58220}.sub{font-size:11px;color:#b5bdc5;margin-top:4px}.nav{margin-top:32px;display:grid;gap:5px}.nav button{background:transparent;color:#c7cbd0;border:0;text-align:left;border-radius:10px;padding:12px}.nav button.active,.nav button:hover{background:#343a40;color:#fff}.main{padding:27px 34px 90px;min-width:0}.top{display:flex;justify-content:space-between;align-items:center;gap:14px}.eyebrow{font-size:12px;color:#747b83;text-transform:uppercase;letter-spacing:1px}.top h1{margin:5px 0;font-size:28px}.switch{display:flex;background:#e6e8ea;padding:4px;border-radius:11px}.switch button{border:0;background:transparent;padding:9px 15px;border-radius:8px}.switch button.on{background:#fff;box-shadow:0 1px 5px #0002;font-weight:700}.banner{margin:22px 0;background:#22282d;color:white;padding:22px 25px;border-radius:17px;display:flex;justify-content:space-between;gap:15px;align-items:center}.banner strong{font-size:19px}.banner p{color:#c5cbd0;font-size:13px;margin:7px 0 0}.pill{background:#f58220;color:#1c2024;padding:7px 10px;border-radius:99px;font-size:11px;font-weight:800;white-space:nowrap}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.card{background:white;border:1px solid #e6e8eb;border-radius:14px;padding:18px}.metric{font-size:29px;font-weight:800;margin-top:9px}.muted{color:#737c84;font-size:13px}.section{margin-top:26px}.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.sectionhead h2{font-size:18px;margin:0}.primary{border:0;background:#f58220;color:#1f2529;font-weight:750;border-radius:10px;padding:11px 15px}.secondary{border:1px solid #d6dade;background:white;border-radius:10px;padding:10px 14px}.list{display:grid;gap:10px}.item{background:white;border:1px solid #e7e9eb;border-radius:13px;padding:15px;display:flex;align-items:center;justify-content:space-between;gap:12px}.item strong{display:block}.tag{font-size:11px;background:#f1f3f4;border-radius:99px;padding:6px 9px;color:#59636b;display:inline-block}.tag.warn{background:#fff1dc;color:#9a5a00}.tag.ok{background:#e6f7ed;color:#1c7c49}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.form{display:grid;gap:12px}.form label{font-size:12px;font-weight:700;color:#4e5961;display:grid;gap:5px}.form input,.form select,.form textarea{width:100%;padding:12px;border:1px solid #d8dce0;border-radius:9px;background:white}.form textarea{min-height:75px}.modalwrap{position:fixed;inset:0;background:#1119;display:grid;place-items:center;padding:16px;z-index:9}.modal{background:#fff;border-radius:18px;padding:23px;width:min(480px,100%);max-height:90vh;overflow:auto}.modalhead{display:flex;justify-content:space-between;align-items:center}.modalhead h2{margin:0 0 15px}.close{border:0;background:#f0f2f4;border-radius:8px;padding:7px 11px}.notice{border-left:4px solid #f58220;background:#fff8ef;padding:12px 15px;border-radius:6px;font-size:13px}.bottom{display:none}.empty{background:#fff;border:1px dashed #cdd2d6;border-radius:13px;padding:25px;color:#6e767d;text-align:center}.price{font-size:28px;font-weight:850}.plan{display:grid;gap:10px}.plan ul{padding-left:18px;font-size:13px;color:#59636b;line-height:1.9}.mini{font-size:12px;color:#747c84}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.btnlink{background:none;border:0;color:#a45b13;text-decoration:underline;padding:5px}.status{font-size:12px}.error{color:#ad302a}.hidden{display:none}@media(max-width:760px){.shell{display:block}.side{display:none}.main{padding:20px 15px 92px}.top{align-items:flex-start;flex-direction:column}.top h1{font-size:25px}.banner{padding:18px}.banner strong{font-size:17px}.cards{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.cards .card{padding:12px}.metric{font-size:22px}.grid2{grid-template-columns:1fr}.bottom{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(5,1fr);background:#fff;border-top:1px solid #e1e4e7;z-index:4}.bottom button{border:0;background:white;padding:11px 2px 14px;font-size:10px;color:#58616b}.bottom button.active{color:#c76b0c;font-weight:800}.item{align-items:flex-start}.item .row{justify-content:flex-end}}
</style></head><body><div class="shell"><aside class="side"><div class="brand">KORVEX <b>CONNECT</b></div><div class="sub">Manage. Maintain. Connect.</div><div class="nav" id="desktopNav"></div><p class="mini" style="margin-top:40px;color:#9da6ad">PROTOTYPE V1 · FICTIONAL DATA<br>Not connected to external services</p></aside><main class="main"><header class="top"><div><div class="eyebrow">KORVEX BUSINESS GROUP LLP · Demo</div><h1 id="heading">Overview</h1></div><div class="switch"><button id="personal" onclick="switchMode('personal')">Personal</button><button id="fleet" onclick="switchMode('fleet')">Fleet</button></div></header><div id="content"></div></main></div><nav class="bottom" id="mobileNav"></nav><div id="modalRoot"></div><script>
const KEY='korvex-connect-demo-v1';const seed={personal:{vehicles:[{id:1,name:'Family Car',number:'KL 10 AB 1234',type:'Car',insurance:'2027-02-18',fitness:'',notes:'Fictional sample vehicle'}],expenses:[{id:2,vehicle:1,category:'Fuel',amount:2500,date:'2026-11-01'}],maintenance:[{id:3,vehicle:1,task:'Engine oil service',date:'2026-10-15',cost:3200}],trips:[],requests:[]},fleet:{vehicles:[{id:4,name:'Delivery Truck 01',number:'KL 54 CD 5678',type:'Truck',insurance:'2026-12-10',fitness:'2027-01-20',notes:'Fictional sample vehicle'},{id:5,name:'Delivery Van 02',number:'KL 54 EF 9012',type:'Van',insurance:'2027-03-12',fitness:'2027-04-01',notes:'Fictional sample vehicle'}],expenses:[{id:6,vehicle:4,category:'Diesel',amount:8500,date:'2026-11-02'}],maintenance:[],trips:[{id:7,vehicle:4,route:'Changaramkulam → Kochi',date:'2026-11-03',status:'Completed'}],requests:[]}};let data;try{data=JSON.parse(localStorage.getItem(KEY))||structuredClone(seed)}catch(e){data=structuredClone(seed)}let mode='personal',page='Overview';const pages=['Overview','Vehicles','Expenses','Maintenance','Trips','Services','Plans'];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>'₹'+Number(n||0).toLocaleString('en-IN');const state=()=>data[mode];const vehicle=id=>state().vehicles.find(v=>String(v.id)===String(id));const save=()=>localStorage.setItem(KEY,JSON.stringify(data));const uid=()=>Date.now()+Math.floor(Math.random()*1000);const btn=(label,action,cls='primary')=>`<button class="${cls}" onclick="${action}">${label}</button>`;function switchMode(m){mode=m;page='Overview';render()}function go(p){page=p;render();scrollTo(0,0)}function nav(){document.getElementById('desktopNav').innerHTML=pages.map(p=>`<button class="${page===p?'active':''}" onclick="go('${p}')">${p}</button>`).join('')+`<button onclick="resetDemo()">Reset demo data</button>`;document.getElementById('mobileNav').innerHTML=['Overview','Vehicles','Expenses','Services','Plans'].map((p,i)=>`<button class="${page===p?'active':''}" onclick="go('${p}')"><div style="font-size:18px">${['⌂','▤','₹','✦','◇'][i]}</div>${p}</button>`).join('')}function render(){nav();document.getElementById('personal').className=mode==='personal'?'on':'';document.getElementById('fleet').className=mode==='fleet'?'on':'';document.getElementById('heading').textContent=page;const s=state();let h='';if(page==='Overview'){const total=s.expenses.reduce((a,e)=>a+Number(e.amount),0);const alerts=s.vehicles.flatMap(v=>[['Insurance',v.insurance],['Fitness',v.fitness]].filter(x=>x[1]&&Math.ceil((new Date(x[1]+'T00:00:00')-new Date())/86400000)<=90).map(x=>({v,label:x[0],date:x[1]})));h=`<div class="banner"><div><strong>${mode==='personal'?'Your vehicles, one simple place.':'Your fleet, clearly in control.'}</strong><p>Explore the demo, add records, and switch workspaces.</p></div><span class="pill">DEMO ONLY</span></div><div class="cards"><div class="card"><div class="muted">Vehicles</div><div class="metric">${s.vehicles.length}</div></div><div class="card"><div class="muted">Expenses</div><div class="metric">${s.expenses.length}</div></div><div class="card"><div class="muted">Total logged</div><div class="metric" style="font-size:20px">${money(total)}</div></div></div><section class="section"><div class="sectionhead"><h2>Vehicle Passport</h2>${btn('+ Add vehicle','openForm("vehicle")')}</div>${vehicleList(s.vehicles.slice(0,3))}</section><section class="section"><div class="sectionhead"><h2>Document reminders</h2></div>${alerts.length?`<div class="list">${alerts.map(a=>`<div class="item"><div><strong>${esc(a.v.name)} · ${a.label}</strong><div class="muted">Due ${esc(a.date)} · ${esc(a.v.number)}</div></div><span class="tag warn">Check renewal</span></div>`).join('')}</div>`:'<div class="empty">No document dates within the next 90 days. Add a vehicle to track dates.</div>'}</section><section class="section"><div class="notice">All records are fictional demonstration data stored in this browser only. No accounts, notifications, cloud sync, insurer APIs, or payments are connected.</div></section>`}else if(page==='Vehicles'){h=`<section class="section"><div class="sectionhead"><h2>${mode==='personal'?'My vehicles':'Fleet vehicles'}</h2>${btn('+ Add vehicle','openForm("vehicle")')}</div>${vehicleList(s.vehicles)}</section>`}else if(page==='Expenses'){h=`<section class="section"><div class="sectionhead"><h2>Expense records</h2>${btn('+ Add expense','openForm("expense")')}</div>${recordList(s.expenses,e=>`${esc(e.category)} · ${money(e.amount)}`,e=>`${esc(vehicle(e.vehicle)?.number||'Unassigned')} · ${esc(e.date)}`,'expense')}</section>`}else if(page==='Maintenance'){h=`<section class="section"><div class="sectionhead"><h2>Maintenance history</h2>${btn('+ Add service','openForm("maintenance")')}</div>${recordList(s.maintenance,e=>`${esc(e.task)} · ${money(e.cost)}`,e=>`${esc(vehicle(e.vehicle)?.number||'Unassigned')} · ${esc(e.date)}`,'maintenance')}</section>`}else if(page==='Trips'){h=`<section class="section"><div class="sectionhead"><h2>Trip register</h2>${btn('+ Add trip','openForm("trip")')}</div>${recordList(s.trips,e=>esc(e.route),e=>`${esc(vehicle(e.vehicle)?.number||'Unassigned')} · ${esc(e.date)} · ${esc(e.status)}`,'trip')}</section>`}else if(page==='Services'){h=`<section class="section"><div class="sectionhead"><h2>KORVEX ecosystem</h2></div><div class="grid2">${['Insurance care enquiry','Tyres enquiry','Spare parts enquiry','Fleet support enquiry'].map(n=>`<div class="card"><strong>${n}</strong><p class="muted">Request capture only. No live booking or quotation.</p>${btn('Create demo request',`requestService('${n}')`,'secondary')}</div>`).join('')}</div></section><section class="section"><div class="sectionhead"><h2>Demo requests</h2></div>${recordList(s.requests,e=>esc(e.service),e=>`${esc(e.date)} · Demo only · Not submitted`,'request')}</section>`}else if(page==='Plans'){h=`<div class="banner"><div><strong>Simple plans for every journey</strong><p>Illustrative first-year prices — not approved for sale.</p></div><span class="pill">PROPOSED</span></div><div class="grid2">${[{n:'Free',p:'₹0',f:['Up to 2 vehicles','Basic reminders','10 expenses / month','1 PDF / month']},{n:'Plus',p:'₹299/year',f:['Up to 10 vehicles','250 MB document allowance','100 expenses / month','10 PDFs / month']},{n:'Pro',p:'₹999/year',f:['Up to 30 vehicles','Owner + 3 staff (planned)','Fleet trips and reports','Excel export allowance']}].map(x=>`<div class="card plan"><strong>${x.n}</strong><div class="price">${x.p}</div><span class="tag">Pricing hypothesis</span><ul>${x.f.map(t=>`<li>${t}</li>`).join('')}</ul><button class="secondary" disabled>Not available in demo</button></div>`).join('')}</div><section class="section"><div class="notice">Plan limits are proposed product requirements, not enforced entitlements in this local prototype.</div></section>`}document.getElementById('content').innerHTML=h}function vehicleList(vs){return vs.length?`<div class="list">${vs.map(v=>`<div class="item"><div><strong>${esc(v.name)}</strong><div class="muted">${esc(v.number)} · ${esc(v.type)}</div><div style="margin-top:7px" class="row"><span class="tag">Insurance: ${esc(v.insurance||'Not set')}</span>${v.fitness?`<span class="tag">Fitness: ${esc(v.fitness)}</span>`:''}</div></div>${btn('View',`viewVehicle(${v.id})`,'secondary')}</div>`).join('')}</div>`:'<div class="empty">No vehicles yet. Add your first vehicle.</div>'}function recordList(items,title,desc,kind){return items.length?`<div class="list">${items.slice().reverse().map(e=>`<div class="item"><div><strong>${title(e)}</strong><div class="muted">${desc(e)}</div></div>${btn('Delete',`removeItem('${kind}',${e.id})`,'secondary')}</div>`).join('')}</div>`:'<div class="empty">No records yet.</div>'}function removeItem(k,id){if(!confirm('Delete this demo record?'))return;let prop={expense:'expenses',maintenance:'maintenance',trip:'trips',request:'requests'}[k];state()[prop]=state()[prop].filter(x=>x.id!==id);save();render()}function viewVehicle(id){let v=vehicle(id);if(!v)return;showModal(`<h2>${esc(v.name)}</h2><p><strong>Registration:</strong> ${esc(v.number)}</p><p><strong>Type:</strong> ${esc(v.type)}</p><p><strong>Insurance expiry:</strong> ${esc(v.insurance||'Not recorded')}</p><p><strong>Fitness expiry:</strong> ${esc(v.fitness||'Not recorded')}</p><p><strong>Notes:</strong> ${esc(v.notes||'None')}</p><div class="notice">Vehicle data is entered manually. No VAHAN verification.</div>`)}function requestService(service){const id=uid();state().requests.push({id,service,date:new Date().toISOString().slice(0,10)});save();render();alert('Demo request saved locally. Nothing was sent to KORVEX or an insurer.')}function showModal(inner){document.getElementById('modalRoot').innerHTML=`<div class="modalwrap" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modalhead"><span class="eyebrow">KORVEX CONNECT · Demo</span><button class="close" onclick="closeModal()">✕</button></div>${inner}</div></div>`}function closeModal(){document.getElementById('modalRoot').innerHTML=''}function openForm(kind){let s=state(),opts=s.vehicles.map(v=>`<option value="${v.id}">${esc(v.number)} — ${esc(v.name)}</option>`).join('');if(kind!=='vehicle'&&!s.vehicles.length){alert('Add a vehicle first.');return}let fields={vehicle:`<label>Vehicle name<input name="name" required maxlength="70" placeholder="e.g. My Car"></label><label>Registration number<input name="number" required maxlength="24" placeholder="KL 00 AA 0000"></label><label>Vehicle type<select name="type"><option>Car</option><option>Bike</option><option>Truck</option><option>Van</option><option>Bus</option><option>Other</option></select></label><label>Insurance expiry<input name="insurance" type="date"></label><label>Fitness expiry<input name="fitness" type="date"></label><label>Notes<textarea name="notes" maxlength="300"></textarea></label>`,expense:`<label>Vehicle<select name="vehicle">${opts}</select></label><label>Expense category<input name="category" required maxlength="60" placeholder="Fuel, toll, repair..."></label><label>Amount (₹)<input name="amount" type="number" min="0" step="0.01" required></label><label>Date<input name="date" type="date" required value="${new Date().toISOString().slice(0,10)}"></label>`,maintenance:`<label>Vehicle<select name="vehicle">${opts}</select></label><label>Service performed<input name="task" required maxlength="100"></label><label>Cost (₹)<input name="cost" type="number" min="0" step="0.01" required></label><label>Date<input name="date" type="date" required value="${new Date().toISOString().slice(0,10)}"></label>`,trip:`<label>Vehicle<select name="vehicle">${opts}</select></label><label>Route<input name="route" required maxlength="150" placeholder="Origin → Destination"></label><label>Trip date<input name="date" type="date" required value="${new Date().toISOString().slice(0,10)}"></label><label>Status<select name="status"><option>Planned</option><option>In progress</option><option>Completed</option></select></label>`}[kind];showModal(`<h2>Add ${kind==='vehicle'?'vehicle':kind==='expense'?'expense':kind==='maintenance'?'maintenance record':'trip'}</h2><form id="entryForm" class="form">${fields}<button class="primary" type="submit">Save demo record</button></form>`);document.getElementById('entryForm').onsubmit=e=>{e.preventDefault();let o=Object.fromEntries(new FormData(e.target));o.id=uid();if(o.vehicle)o.vehicle=Number(o.vehicle);if(o.amount!==undefined)o.amount=Number(o.amount);if(o.cost!==undefined)o.cost=Number(o.cost);const p={vehicle:'vehicles',expense:'expenses',maintenance:'maintenance',trip:'trips'}[kind];state()[p].push(o);save();closeModal();render()}}function resetDemo(){if(confirm('Reset all demo changes in both workspaces?')){data=structuredClone(seed);save();render()}}render();
</script></body></html>
